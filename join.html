<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1e5a43" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Join the call · AI-Boltai</title>
    <!--
      Opened from a Telemost or Zoom call notification on iPhones (public/sw.js). A Home Screen
      app that opened the meeting itself would stay stuck on the meeting's page, with no back
      button; this page hands the link to Safari or the Zoom / Telemost app instead, and stays
      ours. Plain HTML: it must load even where our server is blocked.
    -->
    <style>
      :root {
        --bg: #faf7f2;
        --fg: #1f2a24;
        --muted: #5f6b64;
        --brand: #1e5a43;
        --card: #ffffff;
        --line: #e4ddd2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a17;
          --fg: #eef2ef;
          --muted: #a9b4ad;
          --brand: #3f9a74;
          --card: #1c2420;
          --line: #2c3631;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: min(26rem, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
      }
      .ru {
        color: var(--muted);
        font-size: 0.85em;
      }
      p {
        margin: 8px 0;
      }
      .join {
        display: block;
        margin: 20px 0 12px;
        padding: 16px;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 1.15rem;
        font-weight: 600;
        text-decoration: none;
      }
      .back {
        display: inline-block;
        padding: 10px 14px;
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      .link {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        word-break: break-all;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="ok" hidden>
        <h1>Join the call</h1>
        <div class="ru">Войти в звонок</div>
        <p id="service"></p>
        <a id="join" class="join" target="_blank" rel="noopener noreferrer">
          Join (войти)
        </a>
        <p class="ru" id="hint"></p>
        <p class="link" id="link"></p>
      </div>
      <div id="bad" hidden>
        <h1>This link can't be opened</h1>
        <div class="ru">Эту ссылку нельзя открыть</div>
        <p>Only Telemost and Zoom meeting links are opened from here.</p>
      </div>
      <a class="back" href="/app">← Back to AI-Boltai <span class="ru">(назад)</span></a>
    </main>
    <script>
      // Same rules as public.is_telemost_url / public.is_zoom_url in the database.
      var TELEMOST = /^https:\/\/telemost(\.360)?\.yandex\.(ru|com)\/[A-Za-z0-9._~/?=&%#+-]{2,255}$/;
      var ZOOM = /^https:\/\/([a-z0-9-]+\.)?zoom\.us\/(j|my)\/[A-Za-z0-9._~/?=&%#+-]{2,240}$/;
      var url = new URLSearchParams(location.search).get("u") || "";
      var service = TELEMOST.test(url) ? "Telemost" : ZOOM.test(url) ? "Zoom" : null;
      if (service) {
        document.getElementById("ok").hidden = false;
        document.getElementById("service").textContent =
          service === "Zoom" ? "Zoom (Zoom)" : "Yandex Telemost (Яндекс Телемост)";
        document.getElementById("join").href = url;
        document.getElementById("join").textContent = "Join in " + service + " (войти)";
        document.getElementById("hint").textContent =
          service === "Zoom"
            ? "Opens the Zoom app (Открывает приложение Zoom)"
            : "Opens Telemost in Safari or its app (Открывает Телемост)";
        document.getElementById("link").textContent = url;
      } else {
        document.getElementById("bad").hidden = false;
      }
    </script>
  </body>
</html>
